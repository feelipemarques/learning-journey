name: test-and-build
on:
    push:
        branches:
            github-actions
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Java
              uses: actions/setup-java@v3
              with:
                  distribution: temurin
                  java-version: 21
            - name: Tests
              run: mvn -f github-actions-test/pom.xml test
            - name: Build
              run: mvn -f github-actions-test/pom.xml package
