name: test-and-build
on:
    push:
        branches:
            github-actions
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Set up Java
              uses: actions/setup-java@v3
              with:
                  distribution: temurin
                  java-version: 21
            - name: Tests and build
              run: mvn clean verify package
